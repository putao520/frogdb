# Vendored from crates.io swapvec 0.3.0 with lz4_flex bumped past RUSTSEC-2026-0041.
# Upstream still pins lz4_flex 0.10.0 (vulnerable); cozo 0.7.6 depends on swapvec ^0.3.
# Only change vs upstream: lz4_flex 0.10.0 → 0.11.6 (API: compress_prepend_size /
# decompress_size_prepended unchanged).
[package]
edition = "2021"
name = "swapvec"
version = "0.3.0"
authors = ["Julian Büttner <git@julianbuettner.dev>"]
description = "A Vector swapping to disk after exceeding a given length (security-patched lz4_flex)"
license = "MIT"
repository = "https://github.com/julianbuettner/swapvec"

[lib]
name = "swapvec"
crate-type = ["lib"]

[dependencies]
bincode = "1.3.3"
# RUSTSEC-2026-0041: lz4_flex 0.10.0 leaks uninit / reused buffer on invalid input.
# Safe: >=0.11.6,<0.12.0 OR >=0.12.1. Prefer 0.11.6 (minimal bump).
lz4_flex = "0.11.6"
miniz_oxide = "0.7.1"
serde = "1.0.160"
tempfile = "3.5.0"
